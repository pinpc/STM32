[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_echo = yes

build_flags =
    -I Core/Inc
    -I USB_DEVICE/App
    -I USB_DEVICE/Target
    -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
    -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc

[platformio]
src_dir = src
include_dir = Core/Inc
